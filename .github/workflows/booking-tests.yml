name: Booking regression tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node --experimental-vm-modules --test tests/booking-*.test.mjs
